<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mental Health Self-Love</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #F8FAFC;
  text-align: center;
  padding: 40px;
}
h1 {
  color: #A78BFA;
}
button {
  background: #A78BFA;
  border: none;
  padding: 15px 25px;
  color: white;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
}
.card {
  background: white;
  padding: 20px;
  margin-top: 30px;
  border-radius: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}
</style>
</head>
<body>

<h1>🌿 Mental Health Self-Love</h1>
<p>You are enough. Tempat aman untuk bertumbuh.</p>

<button onclick="showMood()">Isi Mood Hari Ini</button>

<div id="moodBox" class="card" style="display:none;">
  <h3>Pilih Mood Kamu</h3>
  <div style="font-size:30px;">
    😄 🙂 😐 😔 😣
  </div>
</div>

<script>
function showMood(){
  document.getElementById("moodBox").style.display = "block";
}
</script>

</body>
</html>
